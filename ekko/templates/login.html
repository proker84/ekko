<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekko — Accedi</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:light-dark(#f9f9f7,#0d0d0d); color:light-dark(#0b0b0b,#fff);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:24px; }
  .logo { font-size:2.6rem; font-weight:700; letter-spacing:-.02em; }
  .logo span { color:#2a78d6; }
  .tag { color:light-dark(#52514e,#c3c2b7); margin:6px 0 30px; font-size:.95rem;
    text-align:center; max-width:420px; line-height:1.5; }
  .card { background:light-dark(#fcfcfb,#1a1a19);
    border:1px solid light-dark(rgba(11,11,11,.12),rgba(255,255,255,.12));
    border-radius:16px; padding:30px 28px; box-shadow:0 4px 24px rgba(0,0,0,.06);
    width:100%; max-width:400px; text-align:center; }
  .card h1 { font-size:1.15rem; margin-bottom:6px; }
  .card p { color:light-dark(#52514e,#c3c2b7); font-size:.86rem; margin-bottom:22px;
    line-height:1.5; }
  .gbtn { display:inline-flex; align-items:center; justify-content:center; gap:12px;
    width:100%; background:#fff; color:#3c4043; border:1px solid #dadce0;
    border-radius:10px; padding:12px 16px; font-size:.95rem; font-weight:600;
    text-decoration:none; cursor:pointer; transition:box-shadow .15s,border-color .15s; }
  .gbtn:hover { box-shadow:0 1px 4px rgba(60,64,67,.25); border-color:#c6c9ce; }
  .gbtn svg { width:20px; height:20px; flex:none; }
  .foot { margin-top:20px; font-size:.72rem; color:light-dark(#898781,#898781);
    line-height:1.5; }
</style>
</head>
<body>
  <div class="logo">ekko<span>.</span></div>
  <div class="tag">Reputation intelligence per agenzie.<br>Accedi per vedere le recensioni dei tuoi clienti.</div>

  <div class="card">
    <h1>Accedi ad Ekko</h1>
    <p>Ogni agenzia vede soltanto le proprie aziende e le proprie analisi.</p>
    <a class="gbtn" href="{{ login_url }}">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Accedi con Google
    </a>
    <div class="foot">Usiamo Google solo per verificare la tua identità
      (nome ed email). Nessun accesso ai tuoi dati Google.</div>
  </div>
</body>
</html>
