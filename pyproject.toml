[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekko"
version = "0.1.0"
description = "Ekko — Reputation Intelligence Platform (walking skeleton, Fase 0)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "flask>=3.0",
    "jinja2>=3.1",
    "httpx>=0.27",
]

# Roadmap Fase 1: migrazione Flask->FastAPI e sqlite3->SQLAlchemy/Postgres.
[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ekko*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
