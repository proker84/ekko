services:
  - type: web
    name: ekko
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/gen_demo_data.py"
    startCommand: "gunicorn ekko.api.main:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EKKO_AI_PROVIDER
        value: gemini
      - key: EKKO_AI_MODEL
        value: gemini-flash-latest
      - key: DATAFORSEO_AUTH
        sync: false
      - key: EKKO_DATAFORSEO_TIMEOUT
        value: "240"
      - key: EKKO_ENABLE_PUBLIC_TRUSTPILOT
        value: "1"
      - key: EKKO_AUTHOR_HMAC_KEY
        sync: false
      # ─── Login agenzie: Accedi con Google (multi-tenant) ───
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false            # da Google Cloud Console (OAuth Client ID web)
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false            # segreto del client OAuth
      - key: EKKO_SECRET_KEY
        generateValue: true    # firma i cookie di sessione (sessioni persistenti)
      - key: EKKO_BASE_URL
        value: "https://ekko-l58k.onrender.com"  # per redirect_uri e cookie sicuro
      # ─── Fonti aggiuntive (16/08) ───
      - key: EKKO_ENABLE_TRIPADVISOR
        value: "1"             # via DataForSEO (stesso account di Google)
      - key: EKKO_ENABLE_AUTOSCOUT24
        value: "1"             # scraper pagine concessionari (automotive)
      - key: EKKO_ENABLE_FEEDATY
        value: "1"             # scraper pagine certificato Feedaty
      - key: EKKO_ENABLE_RECENSIONI_VERIFICATE
        value: "1"             # scraper Avis Vérifiés Italia
      - key: FACEBOOK_PAGE_TOKEN
        sync: false            # token pagina Meta (solo pagine di proprietà)
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false            # app Meta (collega pagine Facebook)
      - key: FACEBOOK_APP_SECRET
        sync: false
